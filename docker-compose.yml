services:
  backend:
    build: ./backend
    container_name: lab_backend
    restart: always
    environment:
      - NODE_ENV=production
      - JWT_SECRET=facultad_lab_secret_2024
      - PORT=3000
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lab_network

  nginx:
    image: nginx:alpine
    container_name: lab_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - lab_network

networks:
  lab_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
