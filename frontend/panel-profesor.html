<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Prácticas — Sistema de Laboratorio</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        /* Toast de aviso */
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1a1a2e; color: white;
            padding: 12px 20px; border-radius: 8px;
            font-size: .86rem; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,.25);
            z-index: 999; opacity: 0;
            transition: opacity .3s;
            max-width: 480px; width: 90%;
        }
        .toast.visible { opacity: 1; }
        .toast svg { flex-shrink: 0; }

        /* Card offline mejorada */
        .prac-card.offline {
            border-left-color: #f59e0b;
            background: #fffbeb;
            cursor: pointer;
        }
        .prac-card.offline:hover {
            background: #fef3c7;
            border-left-color: #d97706;
        }
        .prac-card.offline .prac-title { color: #92400e; }
        .prac-card.offline .prac-sub   { color: #b45309; }

        /* Card verificando */
        .prac-card.verificando {
            border-left-color: #3b82f6;
            background: #eff6ff;
            cursor: wait;
            pointer-events: none;
        }

        /* Mensaje de aviso al técnico */
        .offline-msg {
            display: flex; align-items: flex-start; gap: 8px;
            background: #fef3c7; border: 1px solid #fde68a;
            border-radius: 8px; padding: 10px 14px;
            font-size: .82rem; color: #92400e; margin-top: 6px;
        }
        .offline-msg svg { flex-shrink: 0; margin-top: 1px; }

        /* Banner de resumen si hay offline */
        .banner-offline {
            background: #fef3c7; border: 1.5px solid #f59e0b;
            border-radius: 8px; padding: 12px 16px;
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 16px; font-size: .87rem; color: #92400e;
        }
        .banner-offline svg { flex-shrink: 0; color: #d97706; }
        .banner-offline strong { font-weight: 700; }

        /* Spinner inline */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            width: 14px; height: 14px; border: 2px solid #93c5fd;
            border-top-color: #2563eb; border-radius: 50%;
            animation: spin .7s linear infinite; flex-shrink: 0;
        }
    </style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;overflow:hidden">

<nav class="navbar" style="height:42px">
    <div class="navbar-brand">
        <img src="assets/img/udemm_logo.png"
             alt="UdeMM" style="height:30px;filter:brightness(0) invert(1);mix-blend-mode:screen;opacity:.9;flex-shrink:0">
        <div>
            <div class="navbar-brand-text">Laboratorio de Ingeniería</div>
            <div class="navbar-brand-sub">Universidad de la Marina Mercante</div>
        </div>
    </div>
    <div class="navbar-right">
        <span class="navbar-rol">Profesor</span>
        <span class="navbar-user" id="nombreUsuario">—</span>
        <button class="navbar-btn" onclick="API.logout()">Salir</button>
    </div>
</nav>

<!-- Toast de aviso -->
<div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" width="18" height="18"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span id="toastMsg"></span>
</div>

<div style="flex:1;overflow-y:auto;padding:20px 24px;background:var(--gris-bg)">

    <div id="alerta" style="display:none;margin-bottom:14px"></div>
    <div id="bannerOffline" style="display:none"></div>

    <div class="toolbar">
        <input type="text" class="field-input" id="buscador" style="max-width:260px"
               placeholder="Buscar práctica..." oninput="filtrar()">
        <select class="field-select" id="filtroMateria" style="max-width:200px" onchange="filtrar()">
            <option value="">Todas las materias</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="cargarPracticas()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Actualizar
        </button>
    </div>

    <div id="listaPracticas">
        <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <p>Cargando prácticas...</p>
        </div>
    </div>
</div>

<script src="assets/js/api.js"></script>
<script>
    let todas = [];
    let _primeraVez = true;
    const usuario = API.requireAuth();
    if (usuario) document.getElementById('nombreUsuario').textContent = usuario.nombre;

    // ── Toast ─────────────────────────────────────────────────
    let _toastTimer;
    function mostrarToast(msg, duracion = 5000) {
        const el = document.getElementById('toast');
        document.getElementById('toastMsg').textContent = msg;
        el.classList.add('visible');
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => el.classList.remove('visible'), duracion);
    }

    function ocultarToast() {
        clearTimeout(_toastTimer);
        document.getElementById('toast').classList.remove('visible');
    }

    // ── Cargar prácticas ──────────────────────────────────────
    async function cargarPracticas() {
        try {
            todas = await API.practicas.listar();
            const materias = [...new Set(todas.map(p => p.materia_nombre).filter(Boolean))];
            const sel = document.getElementById('filtroMateria');
            const valActual = sel.value;
            sel.innerHTML = '<option value="">Todas las materias</option>';
            materias.forEach(m => {
                const o = document.createElement('option');
                o.value = o.textContent = m;
                sel.appendChild(o);
            });
            sel.value = valActual;

            // Detectar offline y avisar
            const offline = todas.filter(p => !p.online);
            const banner  = document.getElementById('bannerOffline');

            if (offline.length > 0) {
                banner.style.display = 'flex';
                banner.innerHTML = `
                    <div class="banner-offline">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                        </svg>
                        <div>
                            <strong>${offline.length} ${offline.length === 1 ? 'práctica no disponible' : 'prácticas no disponibles'}</strong>
                            — ${offline.map(p => p.titulo).join(', ')}.
                            Podés hacer clic en la práctica para verificar si el dispositivo está disponible.
                        </div>
                    </div>`;

                // Toast solo en la primera carga
                if (_primeraVez) {
                    mostrarToast(
                        `${offline.length} ${offline.length === 1 ? 'dispositivo sin conexión' : 'dispositivos sin conexión'}. Hacé clic en la práctica para verificar.`,
                        7000
                    );
                }
            } else {
                banner.style.display = 'none';
            }

            _primeraVez = false;
            filtrar();
        } catch(e) { API.mostrarAlerta('alerta', 'error', e.message); }
    }

    // ── Filtrar ───────────────────────────────────────────────
    function filtrar() {
        const txt = document.getElementById('buscador').value.toLowerCase();
        const mat = document.getElementById('filtroMateria').value;
        const f = todas.filter(p =>
            (!txt || p.titulo.toLowerCase().includes(txt) || (p.descripcion||'').toLowerCase().includes(txt)) &&
            (!mat || p.materia_nombre === mat)
        );
        renderPracticas(f);
    }

    // ── Render ────────────────────────────────────────────────
    function renderPracticas(lista) {
        const cont = document.getElementById('listaPracticas');
        if (!lista.length) {
            cont.innerHTML = `<div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 13h4"/></svg>
                <p>No hay prácticas disponibles.</p></div>`;
            return;
        }

        const grupos = {};
        lista.forEach(p => {
            const m = p.materia_nombre || 'Sin materia';
            if (!grupos[m]) grupos[m] = [];
            grupos[m].push(p);
        });

        let html = '';
        for (const [mat, ps] of Object.entries(grupos)) {
            html += `<div style="margin-bottom:20px">
                <div class="mat-section-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    ${mat}
                </div>`;

            ps.forEach(p => {
                if (p.online) {
                    // ── ONLINE ──────────────────────────────
                    html += `
                    <div class="prac-card" onclick="acceder(${p.id})">
                        <div>
                            <div class="prac-title">${p.titulo}</div>
                            <div class="prac-sub">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                                ${p.dispositivo_nombre || 'Sin dispositivo'}${p.descripcion ? ' · ' + p.descripcion : ''}
                            </div>
                        </div>
                        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
                            <span class="badge badge-online">
                                <svg viewBox="0 0 24 24" width="7" height="7" fill="#16a34a"><circle cx="12" cy="12" r="12"/></svg>
                                Disponible
                            </span>
                            <span class="prac-arrow">→</span>
                        </div>
                    </div>`;
                } else {
                    // ── OFFLINE — clickeable para verificar en vivo ──
                    html += `
                    <div class="prac-card offline" id="card-${p.id}" onclick="verificarYAcceder(${p.id})">
                        <div style="flex:1">
                            <div class="prac-title">${p.titulo}</div>
                            <div class="prac-sub">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                                ${p.dispositivo_nombre || 'Sin dispositivo'}${p.descripcion ? ' · ' + p.descripcion : ''}
                            </div>
                            <div class="offline-msg" id="msg-${p.id}">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                                Sin conexión registrada — hacé clic para verificar si está disponible.
                            </div>
                        </div>
                        <div style="flex-shrink:0;margin-left:12px">
                            <span class="badge badge-offline" id="badge-${p.id}">
                                <svg viewBox="0 0 24 24" width="7" height="7" fill="#94a3b8"><circle cx="12" cy="12" r="12"/></svg>
                                Sin conexión
                            </span>
                        </div>
                    </div>`;
                }
            });

            html += '</div>';
        }
        cont.innerHTML = html;
    }

    // ── Acceder a práctica ONLINE ─────────────────────────────
    async function acceder(id) {
        try {
            const p    = await API.practicas.obtener(id);
            const ping = await API.dispositivos.ping(p.dispositivo_id);
            if (!ping.online) {
                API.mostrarAlerta('alerta', 'error',
                    'El dispositivo se desconectó. Verificá que esté encendido y avisá al técnico si el problema persiste.');
                await cargarPracticas();
                return;
            }
            window.location.href = `practica.html?id=${id}`;
        } catch(e) { API.mostrarAlerta('alerta', 'error', e.message); }
    }

    // ── Verificar y acceder a práctica OFFLINE ────────────────
    // Hace un ping en vivo al dispositivo. Si responde, navega a la práctica.
    async function verificarYAcceder(id) {
        const card  = document.getElementById(`card-${id}`);
        const badge = document.getElementById(`badge-${id}`);
        const msg   = document.getElementById(`msg-${id}`);

        // Estado: verificando
        card.classList.add('verificando');
        badge.innerHTML = `<div class="spinner"></div> Verificando...`;
        msg.innerHTML   = `<div class="spinner"></div> Consultando el dispositivo, aguardá un momento...`;
        mostrarToast('Verificando conexión con el dispositivo...', 10000);

        try {
            const p    = await API.practicas.obtener(id);
            const ping = await API.dispositivos.ping(p.dispositivo_id);

            ocultarToast();

            if (ping.online) {
                // ¡Está online! Navegar directamente
                window.location.href = `practica.html?id=${id}`;
            } else {
                // Sigue offline — restaurar card y mostrar mensaje
                card.classList.remove('verificando');
                badge.innerHTML = `<svg viewBox="0 0 24 24" width="7" height="7" fill="#94a3b8"><circle cx="12" cy="12" r="12"/></svg> Sin conexión`;
                msg.innerHTML   = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    El dispositivo no responde. Verificá que esté encendido y avisá al técnico si el problema persiste.`;
                API.mostrarAlerta('alerta', 'error',
                    'El dispositivo no responde. Verificá que esté encendido o avisá al técnico de laboratorio.');
            }
        } catch(e) {
            ocultarToast();
            card.classList.remove('verificando');
            badge.innerHTML = `<svg viewBox="0 0 24 24" width="7" height="7" fill="#94a3b8"><circle cx="12" cy="12" r="12"/></svg> Sin conexión`;
            msg.innerHTML   = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Sin conexión registrada — hacé clic para verificar si está disponible.`;
            API.mostrarAlerta('alerta', 'error', e.message);
        }
    }

    // ── Iniciar ───────────────────────────────────────────────
    cargarPracticas();
    setInterval(cargarPracticas, 30000);
    typeof Ayuda !== "undefined" && Ayuda.crear("profesor");
    typeof Ayuda !== "undefined" && Ayuda.actualizar("profesor", "practicas");
</script>
<script>
(function() {
    var s = document.createElement('script');
    s.src = 'assets/js/ayuda.js';
    s.onerror = function() {};
    document.body.appendChild(s);
})();
</script>
</body>
</html>
