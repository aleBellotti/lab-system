<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica — Sistema de Laboratorio</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        @keyframes spin { to { transform: rotate(360deg) } }
    </style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;overflow:hidden">

<nav class="navbar" id="navbar" style="height:42px;flex-shrink:0">
    <div class="navbar-brand" onclick="window.location.href='panel-profesor.html'" style="cursor:pointer;flex-shrink:0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="color:rgba(255,255,255,.7);flex-shrink:0"><polyline points="15 18 9 12 15 6"/></svg>
        <img src="assets/img/udemm_logo.png"
             alt="UdeMM" style="height:30px;filter:grayscale(1) invert(1);mix-blend-mode:screen;opacity:.9;flex-shrink:0">
        <div>
            <div class="navbar-brand-text">Volver a mis prácticas</div>
            <div class="navbar-brand-sub">Laboratorio de Ingeniería</div>
        </div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:0 16px;overflow:hidden">
        <div id="espTitle" style="font-size:.88rem;font-weight:700;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center">—</div>
        <div id="espMat" style="font-size:.65rem;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em">—</div>
    </div>

    <!-- Estado de carga / error en navbar -->
    <div id="navEstado" style="flex-shrink:0;display:flex;align-items:center;gap:5px;padding:0 6px">
        <svg id="navSpinner" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2" width="13" height="13"
             style="animation:spin .9s linear infinite;flex-shrink:0">
            <circle cx="12" cy="12" r="10" stroke-opacity=".3"/>
            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
        </svg>
        <span id="navEstadoMsg" style="font-size:.7rem;color:rgba(255,255,255,.55)">Conectando...</span>
        <span id="navError" title="" style="display:none;cursor:help;line-height:0" onclick="mostrarErrorDetalle()">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fca5a5" stroke-width="2" width="14" height="14">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </span>
    </div>

    <div class="navbar-right">
        <span id="espBadge"><svg viewBox="0 0 24 24" width="9" height="9" fill="#4ade80"><circle cx="12" cy="12" r="12"/></svg></span>
        <span style="font-size:.75rem;font-family:monospace;color:#4ade80" id="espIP"></span>
        <button class="navbar-btn" onclick="recargar()" title="Recargar" style="padding:3px 8px">↻</button>
        <span class="navbar-user" id="nombreUsuario">—</span>
        <button class="navbar-btn" onclick="API.logout()">Salir</button>
        <button class="navbar-btn" id="btnOcultarNav" onclick="toggleNavbar()" title="Ocultar barra" style="padding:3px 8px;opacity:.65">▲</button>
    </div>
</nav>

<!-- Botón flotante para restaurar navbar cuando está oculto -->
<button id="btnRestaurarNav" onclick="toggleNavbar()"
        title="Mostrar barra"
        style="display:none;position:fixed;top:6px;right:10px;z-index:9999;
               background:rgba(20,20,50,.82);border:1px solid rgba(255,255,255,.18);
               color:rgba(255,255,255,.85);border-radius:6px;padding:3px 8px;
               font-size:.75rem;cursor:pointer;backdrop-filter:blur(6px);line-height:1">
    ▼
</button>

<div id="vistaPractica" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <div id="contenedorFrame" style="flex:1;position:relative;padding:0 6px 6px 6px;overflow:hidden">
        <!-- Overlay de carga / error del iframe -->
        <div id="iframeLoader" style="
            position:absolute; inset:0; display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:14px;
            background:var(--gris-bg,#f4f6f9); z-index:10;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5" width="40" height="40"
                 style="animation:spin .9s linear infinite">
                <circle cx="12" cy="12" r="10" stroke-opacity=".25"/>
                <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
            </svg>
            <span style="font-size:.88rem;color:var(--gris-t,#64748b)" id="loaderMsg">Cargando interfaz del dispositivo...</span>
        </div>

        <!-- iFrame apunta DIRECTAMENTE a la IP del ESP32 -->
        <iframe id="espFrame" class="esp-frame" src="" frameborder="0"
                style="width:100%;height:100%;opacity:0;transition:opacity .4s"
                onload="frameLoaded()"></iframe>
    </div>
</div>

<script src="assets/js/api.js"></script>
<script>
    const usuario = API.requireAuth();
    if (usuario) document.getElementById('nombreUsuario').textContent = usuario.nombre;
    const practicaId = new URLSearchParams(window.location.search).get('id');
    if (!practicaId) window.location.href = 'panel-profesor.html';

    let _ip     = null;
    let _dispId = null;
    let _errorMsg = null;

    function setNavEstado(estado, msg) {
        const spinner = document.getElementById('navSpinner');
        const msgEl   = document.getElementById('navEstadoMsg');
        const errorEl = document.getElementById('navError');
        if (estado === 'cargando') {
            spinner.style.display = '';
            msgEl.style.display   = '';
            errorEl.style.display = 'none';
            msgEl.textContent     = msg || 'Conectando...';
        } else if (estado === 'ok') {
            spinner.style.display = 'none';
            msgEl.style.display   = 'none';
            errorEl.style.display = 'none';
        } else if (estado === 'error') {
            spinner.style.display = 'none';
            msgEl.style.display   = 'none';
            errorEl.style.display = '';
            errorEl.title         = msg || 'Error desconocido';
            _errorMsg             = msg;
        }
    }

    function mostrarErrorDetalle() {
        alert(_errorMsg || 'Error desconocido');
    }

    let navVisible = true;
    function toggleNavbar() {
        navVisible = !navVisible;
        document.getElementById('navbar').style.display          = navVisible ? '' : 'none';
        document.getElementById('btnRestaurarNav').style.display  = navVisible ? 'none' : '';
        document.getElementById('contenedorFrame').style.paddingTop = navVisible ? '0' : '6px';
    }

    async function cargarPractica() {
        setNavEstado('cargando', 'Conectando...');
        try {
            const p = await API.practicas.obtener(practicaId);

            if (!p.ip) {
                window.location.href = `error-dispositivo.html?id=${practicaId}&motivo=sin_ip`;
                return;
            }

            _ip     = p.ip;
            _dispId = p.dispositivo_id;

            document.getElementById('espMat').textContent   = p.materia_nombre || '';
            document.getElementById('espTitle').textContent = p.titulo || '';
            document.getElementById('espIP').textContent    = p.ip;

            if (!p.online) {
                document.getElementById('espBadge').innerHTML =
                    '<svg viewBox="0 0 24 24" width="9" height="9" fill="#fbbf24"><circle cx="12" cy="12" r="12"/></svg>';
                document.getElementById('espIP').style.color = '#fbbf24';
            }

            document.getElementById('espFrame').src = `http://${p.ip}/`;
            document.getElementById('vistaPractica').style.display = 'flex';

            setNavEstado('ok');
            iniciarMonitoreo();
        } catch(e) {
            console.error('[practica.html] Error en cargarPractica:', e);
            setNavEstado('error', e.message || 'Error desconocido');
            document.getElementById('vistaPractica').style.display = 'flex';
            document.getElementById('iframeLoader').innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" width="40" height="40">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span style="font-size:.9rem;color:#ef4444;font-weight:600">No se pudo cargar la práctica</span>
                <span style="font-size:.8rem;color:#64748b;max-width:360px;text-align:center">${e.message || 'Error desconocido'}</span>
                <a href="panel-profesor.html" style="font-size:.82rem;color:#2563eb;margin-top:4px">← Volver a mis prácticas</a>
            `;
        }
    }

    function frameLoaded() {
        document.getElementById('iframeLoader').style.display = 'none';
        document.getElementById('espFrame').style.opacity = '1';
    }

    function recargar() {
        if (_ip) {
            document.getElementById('iframeLoader').style.display = 'flex';
            document.getElementById('espFrame').style.opacity = '0';
            document.getElementById('loaderMsg').textContent = 'Recargando interfaz del dispositivo...';
            document.getElementById('espFrame').src = `http://${_ip}/`;
        }
    }

    let monitorInterval;
    function iniciarMonitoreo() {
        setTimeout(() => {
            monitorInterval = setInterval(async () => {
                try {
                    const ping  = await API.dispositivos.ping(_dispId);
                    const badge = document.getElementById('espBadge');
                    badge.innerHTML = ping.online
                        ? '<svg viewBox="0 0 24 24" width="9" height="9" fill="#4ade80"><circle cx="12" cy="12" r="12"/></svg>'
                        : '<svg viewBox="0 0 24 24" width="9" height="9" fill="#fbbf24"><circle cx="12" cy="12" r="12"/></svg>';
                    document.getElementById('espIP').style.color = ping.online ? '#4ade80' : '#fbbf24';
                } catch {}
            }, 20000);
        }, 15000);
    }

    window.addEventListener('beforeunload', () => clearInterval(monitorInterval));
    cargarPractica();
</script>
</body>
</html>
